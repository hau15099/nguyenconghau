<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <title>vd dung Float left</title>
    <style>
        .container {
            width: 1200px;
            margin: 0 auto;
        }

        .row {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }

        * {
            box-sizing: border-box;
        }

        .col-md-3 {
            float: left;
            width: calc(25% - 10px);
            height: 200px;
            border: 1px solid red;
            margin: 5px;
        }

        .menu {
            float: left;
            width: calc(25% - 10px);
            height: 250px;
            border: 1px solid rgb(255, 0, 242);
            margin: 5px;
        }

        .banner {
            float: left;
            width: calc(75% - 10px);
            height: 250px;
            border: 1px solid rgb(0, 219, 117);
            margin: 5px;
        }
    </style>
    <div class="container">
        <div class="row">
            <div class="col-md-3"></div>
            <div class="col-md-3"></div>
            <div class="col-md-3"></div>
            <div class="col-md-3"></div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="menu"></div>
            <div class="banner"></div>
        </div>
    </div>
</body>

</html>
